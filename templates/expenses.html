{% extends 'base.html' %}{% block content %}<div class="page-title"><div><p class="eyebrow">COST CONTROL</p><h1>Business expenses</h1></div></div><section class="panel"><form method="post" class="form-grid"><label>Expense description<input name="title" required></label><label>Amount (KSh)<input type="number" name="amount" min="0.01" step="0.01" required></label><label>Date<input type="date" name="expense_date" value="{{today}}"></label><label>Notes<input name="note"></label><button>Record expense</button></form></section><section class="panel"><div class="table-wrap"><table><tr><th>Description</th><th>Amount</th><th>Date</th><th>Notes</th></tr>{% for r in rows %}<tr><td>{{r.title}}</td><td>{{money(r.amount)}}</td><td>{{r.expense_date}}</td><td>{{r.note}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
