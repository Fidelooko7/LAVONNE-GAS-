{% extends 'base.html' %}{% block content %}<div class="page-title"><div><p class="eyebrow">CUSTOMER DIRECTORY</p><h1>Customers</h1></div></div><section class="panel"><form method="post" class="form-grid"><label>Full name<input name="name" required></label><label>Phone number<input name="phone" required></label><label>Address<input name="address"></label><button>Add customer</button></form></section><section class="panel"><div class="table-wrap"><table><tr><th>Name</th><th>Phone</th><th>Address</th><th>Outstanding balance</th></tr>{% for c in customers %}<tr><td>{{c.name}}</td><td>{{c.phone}}</td><td>{{c.address}}</td><td>KSh {{money(c.balance)}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
