{% extends 'base.html' %}{% block content %}<div class="page-title"><div><p class="eyebrow">SUPPLY & RESTOCK</p><h1>Purchases</h1></div></div><section class="panel"><form method="post" class="form-grid"><label>Product<select name="product_id">{% for p in products %}<option value="{{p.id}}">{{p.brand}} {{p.size}}</option>{% endfor %}</select></label><label>Quantity<input type="number" name="qty" min="1" required></label><label>Buying cost per cylinder<input type="number" name="unit_cost" min="0" step="0.01" required></label><label>Purchase date<input type="date" name="purchase_date" value="{{today}}"></label><label>Supplier<input name="supplier"></label><button>Save purchase & add stock</button></form></section><section class="panel"><h2>Purchase history</h2><div class="table-wrap"><table><tr><th>Product</th><th>Qty</th><th>Unit cost</th><th>Total</th><th>Date</th><th>Supplier</th></tr>{% for r in rows %}<tr><td>{{r.brand}} {{r.size}}</td><td>{{r.qty}}</td><td>{{money(r.unit_cost)}}</td><td>{{money(r.total)}}</td><td>{{r.purchase_date}}</td><td>{{r.supplier}}</td></tr>{% endfor %}</table></div></section>{% endblock %}
